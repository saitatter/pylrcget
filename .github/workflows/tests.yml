name: Tests

on:
  push:
    branches:
      - main
      - ui-refactor
      - personalisation
      - save-features
      - skins-aero-peek
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest==9.1.1" "pytest-cov==7.1.0" "ruff==0.16.7"

      - name: Run Ruff
        run: |
          ruff check .

      - name: Run test suite
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q --cov=src --cov-branch --cov-report=term-missing:skip-covered
