name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.semantic-release.outputs.released || 'false' }}
      tag: ${{ steps.semantic-release.outputs.tag }}
      version: ${{ steps.semantic-release.outputs.version }}
      commit_sha: ${{ steps.semantic-release.outputs.commit_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Semantic release
        id: semantic-release
        uses: python-semantic-release/python-semantic-release@v10.5.3
        with:
          changelog: false
          github_token: ${{ secrets.RELEASE_PAT }}
          git_committer_name: github-actions[bot]
          git_committer_email: 41898282+github-actions[bot]@users.noreply.github.com
          build: false

  build-release-assets:
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive_name: pylrcget-windows.zip
          - os: ubuntu-latest
            archive_name: pylrcget-linux.tar.gz
          - os: macos-latest
            archive_name: pylrcget-macos.tar.gz

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.commit_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm pylrcget.spec

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/pylrcget.exe -DestinationPath ${{ matrix.archive_name }}

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        run: tar -czf "${{ matrix.archive_name }}" -C dist pylrcget

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}

      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: gh release upload "${{ needs.release.outputs.tag }}" "${{ matrix.archive_name }}" --clobber
