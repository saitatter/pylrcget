name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.semantic-release.outputs.released || 'false' }}
      tag: ${{ steps.semantic-release.outputs.tag }}
      version: ${{ steps.semantic-release.outputs.version }}
      commit_sha: ${{ steps.semantic-release.outputs.commit_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Semantic release
        id: semantic-release
        uses: python-semantic-release/python-semantic-release@v10.5.3
        with:
          changelog: true
          github_token: ${{ secrets.RELEASE_PAT }}
          git_committer_name: github-actions[bot]
          git_committer_email: 41898282+github-actions[bot]@users.noreply.github.com
          build: false

  build-release-assets:
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive_name: pylrcget-windows.zip
            installer_name: pylrcget-windows-installer.exe
          - os: ubuntu-latest
            archive_name: pylrcget-linux.tar.gz
            installer_name: pylrcget-linux.deb
          - os: macos-latest
            archive_name: pylrcget-macos.tar.gz
            installer_name: pylrcget-macos.pkg

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.commit_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm pylrcget.spec

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/pylrcget.exe -DestinationPath ${{ matrix.archive_name }}

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        run: tar -czf "${{ matrix.archive_name }}" -C dist pylrcget

      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @"
          [Setup]
          AppId=com.saitatter.pylrcget
          AppName=PyLrcGet
          AppVersion=${{ needs.release.outputs.version }}
          DefaultDirName={autopf}\PyLrcGet
          DefaultGroupName=PyLrcGet
          UninstallDisplayIcon={app}\pylrcget.exe
          OutputDir=.
          OutputBaseFilename=pylrcget-windows-installer
          Compression=lzma
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64compatible
          DisableProgramGroupPage=yes
          WizardStyle=modern

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Files]
          Source: "dist\pylrcget.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{autoprograms}\PyLrcGet"; Filename: "{app}\pylrcget.exe"

          [Run]
          Filename: "{app}\pylrcget.exe"; Description: "Launch PyLrcGet"; Flags: nowait postinstall skipifsilent
          "@ | Set-Content -Path pylrcget-installer.iss -Encoding ascii
          choco install innosetup --no-progress -y
          iscc /Qp pylrcget-installer.iss

      - name: Build Linux installer (.deb)
        if: runner.os == 'Linux'
        run: |
          mkdir -p pkgroot/DEBIAN
          mkdir -p pkgroot/usr/local/bin
          install -m 0755 dist/pylrcget pkgroot/usr/local/bin/pylrcget
          cat > pkgroot/DEBIAN/control <<EOF
          Package: pylrcget
          Version: ${{ needs.release.outputs.version }}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: PyLrcGet Maintainers <noreply@github.com>
          Description: Desktop-native lyrics manager and player built with PySide6.
          EOF
          dpkg-deb --build pkgroot "${{ matrix.installer_name }}"

      - name: Build macOS installer (.pkg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p pkgroot/usr/local/bin
          install -m 0755 dist/pylrcget pkgroot/usr/local/bin/pylrcget
          pkgbuild \
            --root pkgroot \
            --identifier com.saitatter.pylrcget \
            --version "${{ needs.release.outputs.version }}" \
            --install-location / \
            "${{ matrix.installer_name }}"

      - name: Upload workflow artifact (archive)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}

      - name: Upload workflow artifact (installer)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.installer_name }}
          path: ${{ matrix.installer_name }}

      - name: Upload release asset (archive)
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: gh release upload "${{ needs.release.outputs.tag }}" "${{ matrix.archive_name }}" --clobber

      - name: Upload release asset (installer)
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: gh release upload "${{ needs.release.outputs.tag }}" "${{ matrix.installer_name }}" --clobber
