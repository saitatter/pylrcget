name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.semantic-release.outputs.released || 'false' }}
      tag: ${{ steps.semantic-release.outputs.tag }}
      version: ${{ steps.semantic-release.outputs.version }}
      commit_sha: ${{ steps.semantic-release.outputs.commit_sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Semantic release
        id: semantic-release
        uses: python-semantic-release/python-semantic-release@v10.6.1
        with:
          changelog: true
          github_token: ${{ secrets.RELEASE_PAT }}
          git_committer_name: github-actions[bot]
          git_committer_email: 41898282+github-actions[bot]@users.noreply.github.com
          build: false

  build-release-assets:
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive_name: pylrcget-windows.zip
            installer_name: pylrcget-windows-installer.exe
            portable_name: pylrcget-windows-portable.exe
            portable_ai_name: pylrcget-windows-portable-ai.exe
          - os: ubuntu-latest
            archive_name: pylrcget-linux.tar.gz
            installer_name: pylrcget-linux.deb
            portable_name: pylrcget-linux-portable
            portable_ai_name: pylrcget-linux-portable-ai
          - os: macos-latest
            archive_name: pylrcget-macos.tar.gz
            installer_name: pylrcget-macos.pkg
            portable_name: pylrcget-macos-portable
            portable_ai_name: pylrcget-macos-portable-ai

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.commit_sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm pylrcget.spec

      - name: Build portable executable
        run: pyinstaller --noconfirm pylrcget-portable.spec

      - name: Rename portable executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Move-Item -LiteralPath dist/pylrcget-portable.exe -Destination ${{ matrix.portable_name }} -Force

      - name: Rename portable executable (Unix)
        if: runner.os != 'Windows'
        run: mv dist/pylrcget-portable "${{ matrix.portable_name }}"

      - name: Install AI dependencies for portable AI build
        if: runner.os != 'Linux'
        run: pip install .[ai]

      - name: Build AI-enabled portable executable
        if: runner.os != 'Linux'
        run: pyinstaller --noconfirm pylrcget-portable.spec

      - name: Rename AI-enabled portable executable (Windows)
        shell: pwsh
        if: runner.os == 'Windows'
        run: Move-Item -LiteralPath dist/pylrcget-portable.exe -Destination ${{ matrix.portable_ai_name }} -Force

      - name: Rename AI-enabled portable executable (macOS)
        if: runner.os == 'macOS'
        run: mv dist/pylrcget-portable "${{ matrix.portable_ai_name }}"

      - name: Prepare macOS app bundle
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/PyLrcGet.app/Contents/MacOS
          cat > dist/PyLrcGet.app/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key>
            <string>PyLrcGet</string>
            <key>CFBundleExecutable</key>
            <string>pylrcget</string>
            <key>CFBundleIdentifier</key>
            <string>com.saitatter.pylrcget</string>
            <key>CFBundleName</key>
            <string>PyLrcGet</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ needs.release.outputs.version }}</string>
            <key>CFBundleVersion</key>
            <string>${{ needs.release.outputs.version }}</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF
          cp -R dist/pylrcget/. dist/PyLrcGet.app/Contents/MacOS/

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/pylrcget -DestinationPath ${{ matrix.archive_name }}

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            tar -czf "${{ matrix.archive_name }}" -C dist PyLrcGet.app
          else
            tar -czf "${{ matrix.archive_name }}" -C dist pylrcget
          fi

      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @"
          [Setup]
          AppId=com.saitatter.pylrcget
          AppName=PyLrcGet
          AppVersion=${{ needs.release.outputs.version }}
          DefaultDirName={autopf}\PyLrcGet
          DefaultGroupName=PyLrcGet
          UninstallDisplayIcon={app}\pylrcget.exe
          OutputDir=.
          OutputBaseFilename=pylrcget-windows-installer
          Compression=lzma
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64compatible
          DisableProgramGroupPage=yes
          WizardStyle=modern

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Files]
          Source: "dist\pylrcget\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\PyLrcGet"; Filename: "{app}\pylrcget.exe"

          [Run]
          Filename: "{app}\pylrcget.exe"; Description: "Launch PyLrcGet"; Flags: nowait postinstall skipifsilent
          "@ | Set-Content -Path pylrcget-installer.iss -Encoding ascii
          choco install innosetup --no-progress -y
          iscc /Qp pylrcget-installer.iss

      - name: Build Linux installer (.deb)
        if: runner.os == 'Linux'
        run: |
          mkdir -p pkgroot/DEBIAN
          mkdir -p pkgroot/opt/PyLrcGet
          mkdir -p pkgroot/usr/bin
          mkdir -p pkgroot/usr/share/applications
          mkdir -p pkgroot/usr/share/icons/hicolor/scalable/apps
          cp -R dist/pylrcget/. pkgroot/opt/PyLrcGet/
          ln -s /opt/PyLrcGet/pylrcget pkgroot/usr/bin/pylrcget
          cp packaging/linux/pylrcget.desktop pkgroot/usr/share/applications/pylrcget.desktop
          cp packaging/linux/pylrcget.svg pkgroot/usr/share/icons/hicolor/scalable/apps/pylrcget.svg
          cat > pkgroot/DEBIAN/control <<EOF
          Package: pylrcget
          Version: ${{ needs.release.outputs.version }}
          Section: utils
          Priority: optional
          Depends: ffmpeg
          Architecture: amd64
          Maintainer: PyLrcGet Maintainers <noreply@github.com>
          Description: Desktop-native lyrics manager and player built with PySide6.
          EOF
          dpkg-deb --build pkgroot "${{ matrix.installer_name }}"

      - name: Build macOS installer (.pkg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p pkgroot/Applications
          mkdir -p pkgroot/usr/local/bin
          mkdir -p pkgroot-scripts
          cp -R dist/PyLrcGet.app pkgroot/Applications/PyLrcGet.app
          cat > pkgroot/usr/local/bin/pylrcget <<'EOF'
          #!/bin/sh
          exec open -a "/Applications/PyLrcGet.app" --args "$@"
          EOF
          chmod +x pkgroot/usr/local/bin/pylrcget
          cat > pkgroot-scripts/postinstall <<'EOF'
          #!/bin/sh
          set -e
          APP_PATH="/Applications/PyLrcGet.app"
          if [ -d "$APP_PATH" ]; then
            /usr/bin/open -a "$APP_PATH" >/dev/null 2>&1 &
          fi
          exit 0
          EOF
          chmod +x pkgroot-scripts/postinstall
          pkgbuild \
            --root pkgroot \
            --scripts pkgroot-scripts \
            --identifier com.saitatter.pylrcget \
            --version "${{ needs.release.outputs.version }}" \
            --install-location / \
            "${{ matrix.installer_name }}"

      - name: Upload workflow artifact (archive)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}

      - name: Upload workflow artifact (installer)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.installer_name }}
          path: ${{ matrix.installer_name }}

      - name: Upload workflow artifact (portable)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.portable_name }}
          path: ${{ matrix.portable_name }}

      - name: Upload workflow artifact (portable AI)
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.portable_ai_name }}
          path: ${{ matrix.portable_ai_name }}

      - name: Upload release asset (archive)
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: gh release upload "${{ needs.release.outputs.tag }}" "${{ matrix.archive_name }}" --clobber

      - name: Upload release asset (installer)
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: gh release upload "${{ needs.release.outputs.tag }}" "${{ matrix.installer_name }}" --clobber

      - name: Upload release asset (portable)
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: gh release upload "${{ needs.release.outputs.tag }}" "${{ matrix.portable_name }}" --clobber

      - name: Upload release asset (portable AI)
        if: runner.os != 'Linux'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: gh release upload "${{ needs.release.outputs.tag }}" "${{ matrix.portable_ai_name }}" --clobber
