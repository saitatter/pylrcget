[project]
name = "pylrcget"
version = "1.13.1"
description = "Desktop-native lyrics manager and player built with PySide6"
requires-python = ">=3.10"
dependencies = [
    "PySide6",
    "mutagen",
    "requests",
    "packaging",
]

[project.optional-dependencies]
ai = [
    "torch",
    "torchaudio",
    "whisperx",
    "soundfile",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = true

[tool.semantic_release.changelog]
template_dir = "templates"
mode = "init"
exclude_commit_patterns = [
  "^chore\\(release\\):",
  "^Merge ",
]

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "refactor", "ci", "chore"]
# GitHub squash merges keep the PR commits in the squash commit body. Parse that
# body so release notes include each conventional commit from the PR branch.
parse_squash_commits = true
ignore_merge_commits = true
