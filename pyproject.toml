[project]
name = "pylrcget"
version = "1.15.0"
description = "Desktop-native lyrics manager and player built with PySide6"
requires-python = "==3.13.15"
dependencies = [
    "PySide6",
    "mutagen",
    "requests",
    "packaging",
    "keyring",
    "langdetect==1.0.9",
]

[project.optional-dependencies]
ai = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
    "whisperx==3.8.6",
    "soundfile==0.14.0",
    "g2p-en==2.1.0",
    "librosa==1.0.0",
    "demucs==4.1.0",
    "transformers==4.57.6",
    "huggingface-hub==0.36.2",
    "pyannote-audio==4.0.7",
    "numpy==2.5.2",
]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.8",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
commit_message = "chore(release): {version}\n\nRecord the reviewed changelog and package version."
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = true

[tool.semantic_release.changelog]
template_dir = "templates"
mode = "init"
exclude_commit_patterns = [
  "^chore\\(release\\):",
  "^Merge ",
]

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "refactor", "build", "ci", "chore"]
# GitHub squash merges keep the PR commits in the squash commit body. Parse that
# body so release notes include each conventional commit from the PR branch.
parse_squash_commits = true
ignore_merge_commits = true

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"src/db/database.py" = ["E402"]
"tests/test_support.py" = ["E402"]
"tests/widgets_navigation/**/*.py" = ["F401", "F403", "F405"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "slow: tests that are intentionally slower than the unit-test budget",
    "gpu: tests that require a CUDA or other accelerator runtime",
    "network: tests that access an external network service",
    "integration: tests that cross a process, database, or external-runtime boundary",
    "readonly: tests that may inspect a user-selected library but must not modify it",
]

[tool.ruff]
target-version = "py313"
